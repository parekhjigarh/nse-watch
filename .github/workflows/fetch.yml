name: Fetch NSE announcements

on:
  schedule:
    # GitHub cron is in UTC (IST = UTC + 5:30)
    - cron: "30 2 * * 1-5"         # 08:00 IST, Mon-Fri (pre-market)
    - cron: "30 3 * * 1-5"         # 09:00 IST, Mon-Fri
    - cron: "0,30 4-10 * * 1-5"    # 09:30-16:00 IST every 30 min, Mon-Fri
    - cron: "30 15 * * *"          # 21:00 IST, every day (evening filings, weekends too)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python fetch_announcements.py
      - name: Commit if changed
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add -A docs
          git diff --staged --quiet || (git commit -m "update announcements" && git push)

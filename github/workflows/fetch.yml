name: Fetch NSE announcements

on:
  schedule:
    - cron: "*/30 3-11 * * 1-5"   # every 30 min, ~8:30-17:00 IST, Mon-Fri (UTC)
    - cron: "0 */3 * * *"          # plus every 3 hours, any day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_announcements.py
      - name: Commit if changed
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add docs/announcements.json
          git diff --staged --quiet || (git commit -m "update announcements" && git push)
